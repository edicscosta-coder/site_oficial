# Base44 development sandbox setup for the NEXARUS static sales page.
# The repo is a self-contained static site: index.html contains inline CSS/JS
# (styles.css and script.js are the editable sources kept in the repo).
# Files are served straight from the bind-mounted working tree, so edits are
# visible on the next page refresh (call reload_preview after changing files).
services:
  web:
    image: python:3.12-slim
    restart: on-failure
    working_dir: /srv
    command:
      - python
      - -m
      - http.server
      - "3000"
      - --bind
      - "0.0.0.0"
      - --directory
      - /srv
    ports:
      - "3000:3000"
    volumes:
      - ./:/srv:ro
    environment:
      - BASE44_PREVIEW_MODE
    labels:
      base44.project: "NEXARUS Sales Page"
      base44.kind: "web"
      base44.port: "3000"
    healthcheck:
      # HEAD probe: a full GET would be cut off by the client and surface as a
      # noisy ConnectionResetError traceback in the service log.
      test:
        - CMD
        - python
        - -c
        - import urllib.request;print(urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:3000/', method='HEAD'), timeout=3).status)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
